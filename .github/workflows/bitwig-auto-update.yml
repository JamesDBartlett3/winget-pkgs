name: Auto-update Bitwig Studio

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
  push:
    branches:
      - automation
    paths:
      - '.github/workflows/bitwig-auto-update.yml'
      - 'Tools/Update-BitwigManifest.ps1'
      - 'Tools/Setup-BitwigAutomation.ps1'
      - 'docs/bitwig-automation.md'
      - 'docs/upstream-automation-guide.md'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: bitwig-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest
    outputs:
      new-version: ${{ steps.update-manifest.outputs.new-version }}
      current-version: ${{ steps.update-manifest.outputs.current-version }}
      needs-update: ${{ steps.update-manifest.outputs.needs-update }}
      pull-request-number: ${{ steps.create-pr.outputs.pull-request-number }}
      pull-request-url: ${{ steps.create-pr.outputs.pull-request-url }}
    env:
      EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and validate manifests
        id: update-manifest
        shell: pwsh
        run: |
          .\Tools\Update-BitwigManifest.ps1 -OutputPath $env:GITHUB_OUTPUT

      - name: Create pull request
        id: create-pr
        if: steps.update-manifest.outputs.needs-update == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bitwig-studio-${{ steps.update-manifest.outputs.new-version }}
          base: master
          delete-branch: true
          add-paths: |
            manifests/b/bitwig/bitwig/${{ steps.update-manifest.outputs.new-version }}
          commit-message: Add Bitwig Studio ${{ steps.update-manifest.outputs.new-version }}
          title: Add Bitwig Studio ${{ steps.update-manifest.outputs.new-version }}
          body: |
            ## New Package Version

            **Package**: Bitwig Studio
            **Version**: ${{ steps.update-manifest.outputs.new-version }}
            **Previous Version**: ${{ steps.update-manifest.outputs.current-version }}

            ### Changes
            - ✅ Downloaded and verified the available Bitwig installers
            - ✅ Calculated SHA256 checksums
            - ✅ Generated manifests in the current winget-pkgs format
            - ✅ Ran `winget validate`

            ### Notes
            - This workflow creates a review PR in this fork only.
            - The review PR always targets your fork's `master` branch so automation-only files stay out of upstream submission branches.
            - If you keep automation isolated on an `automation` branch, make that branch the fork's default branch so the scheduled run stays active.
            - Review the generated manifests before copying them into a clean upstream contribution branch.

  notify:
    needs: update
    if: always()
    runs-on: ubuntu-latest
    env:
      EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - name: Send Email Notification
        if: needs.update.outputs.needs-update == 'true' && needs.update.outputs.pull-request-number != '' && env.EMAIL_USERNAME != '' && env.EMAIL_PASSWORD != '' && env.EMAIL_TO != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ env.EMAIL_USERNAME }}
          password: ${{ env.EMAIL_PASSWORD }}
          subject: "🎉 New Bitwig Studio ${{ needs.update.outputs.new-version }} Ready for Review"
          to: ${{ env.EMAIL_TO }}
          from: "Bitwig Automation <${{ env.EMAIL_USERNAME }}>"
          html_body: |
            <h2>🎵 New Bitwig Studio Version Ready!</h2>
            <p><strong>Version:</strong> ${{ needs.update.outputs.new-version }}</p>
            <p><strong>Previous Version:</strong> ${{ needs.update.outputs.current-version }}</p>
            <p><strong>Review PR:</strong> <a href="${{ needs.update.outputs.pull-request-url }}">${{ needs.update.outputs.pull-request-url }}</a></p>
            <h3>✅ What's Ready</h3>
            <ul>
              <li>Downloaded and verified the available Bitwig installers</li>
              <li>Calculated SHA256 checksums</li>
              <li>Generated the Bitwig manifest set</li>
              <li>Validated the manifests with <code>winget validate</code></li>
            </ul>
            <h3>🚀 Next Step</h3>
            <p>Review the PR in your fork, then copy the manifest folder into a clean upstream contribution branch when you're ready to submit it.</p>

      - name: Create PR Comment Notification
        if: needs.update.outputs.needs-update == 'true' && needs.update.outputs.pull-request-number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ needs.update.outputs.new-version }}';
            const previousVersion = '${{ needs.update.outputs.current-version }}';
            const pullRequestUrl = '${{ needs.update.outputs.pull-request-url }}';
            const body = [
              '## 🎵 New Bitwig Studio Version Ready for Review',
              '',
              `**Version:** ${version}`,
              `**Previous Version:** ${previousVersion}`,
              `**Review PR:** ${pullRequestUrl}`,
              '',
              '### ✅ Automation Completed',
              '- [x] Downloaded the available Bitwig installers from the official site',
              '- [x] Calculated SHA256 checksums',
              '- [x] Generated a complete manifest set',
              '- [x] Validated the manifests with winget validate',
              '',
              '### 🚀 Next Step',
              `Review the fork PR, then copy manifests/b/bitwig/bitwig/${version} into a clean upstream contribution branch when you're ready to submit it.`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ needs.update.outputs.pull-request-number }},
              body
            });

      - name: Send Discord Notification
        if: needs.update.outputs.needs-update == 'true' && needs.update.outputs.pull-request-number != '' && env.DISCORD_WEBHOOK != ''
        run: |
          payload=$(cat <<'JSON'
          {
            "embeds": [
              {
                "title": "🎵 New Bitwig Studio Release Ready",
                "description": "Version ${{ needs.update.outputs.new-version }} is ready for review in your fork.",
                "color": 3066993,
                "fields": [
                  {
                    "name": "Previous Version",
                    "value": "${{ needs.update.outputs.current-version }}",
                    "inline": true
                  },
                  {
                    "name": "Review PR",
                    "value": "${{ needs.update.outputs.pull-request-url }}",
                    "inline": false
                  }
                ]
              }
            ]
          }
          JSON
          )
          curl -H "Content-Type: application/json" -X POST -d "$payload" "$DISCORD_WEBHOOK"

      - name: Console Notification
        run: |
          if [ "${{ needs.update.outputs.needs-update }}" = "true" ]; then
            if [ -n "${{ needs.update.outputs.pull-request-url }}" ]; then
              echo "✅ Created Bitwig Studio ${{ needs.update.outputs.new-version }} review PR: ${{ needs.update.outputs.pull-request-url }}"
            else
              echo "⚠️ A new version was detected, but no review PR URL was returned."
            fi
          else
            echo "ℹ️ No new Bitwig Studio version found"
          fi
